id: length-trailing
title: Length of a string with a trailing space
cases:
- name: LENGTH('abc ')
  sql: SELECT LENGTH('abc ')
- name: LEN('abc ')
  sql: SELECT LEN('abc ')
explanation: 'SQL Server has no LENGTH; its LEN excludes trailing spaces (docs), so LEN(''abc '') is 3
  while LENGTH(''abc '') counts 4 elsewhere. Docs for the other engines: not checked.'
sources:
- url: https://learn.microsoft.com/en-us/sql/t-sql/functions/len-transact-sql
  title: 'SQL Server: LEN'
  checked: '2026-10-18'
