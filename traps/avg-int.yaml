id: avg-int
title: AVG of an integer column
setup:
- CREATE TABLE t (x INT)
- INSERT INTO t VALUES (1), (2)
teardown:
- DROP TABLE t
cases:
- name: AVG(x) over 1,2
  sql: SELECT AVG(x) FROM t
explanation: 'SQL Server docs: AVG over int returns int, so the average of 1 and 2 is 1. MySQL/MariaDB
  return decimal and PostgreSQL numeric in this run; their docs: not checked.'
sources:
- url: https://learn.microsoft.com/en-us/sql/t-sql/functions/avg-transact-sql
  title: 'SQL Server: AVG return types'
  checked: '2026-10-18'
